definitions:
  api.CloseGenerationRequest.req:
    properties:
      status:
        enum:
        - completed
        - rejected
        type: string
    required:
    - status
    type: object
  api.Login.Res:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  ds.CreateTurbine:
    properties:
      description:
        minLength: 10
        type: string
      height:
        type: integer
      is_active:
        type: boolean
      power:
        type: integer
      title:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - description
    - height
    - is_active
    - power
    - title
    type: object
  ds.CreateUser:
    properties:
      login:
        maxLength: 30
        minLength: 3
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
    required:
    - login
    - password
    type: object
  ds.GenerationRequest:
    properties:
      calculated_generation_sum:
        type: integer
      closed_at:
        type: string
      closed_by:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      formed_at:
        type: string
      id:
        type: integer
      period_days:
        type: integer
      status:
        type: string
      turbine_generation_requests:
        items:
          $ref: '#/definitions/ds.TurbineGenerationRequest'
        type: array
      turbine_generation_requests_count:
        type: integer
    type: object
  ds.Turbine:
    properties:
      description:
        type: string
      height:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      power:
        type: integer
      title:
        type: string
    type: object
  ds.TurbineGenerationRequest:
    properties:
      alpha:
        type: number
      avgVelocity:
        type: number
      calculatedGeneration:
        format: int64
        type: integer
      generationRequestID:
        type: integer
      turbine:
        $ref: '#/definitions/ds.Turbine'
      turbineID:
        type: integer
    type: object
  ds.UpdateGenerationRequest:
    properties:
      period_days:
        type: integer
    type: object
  ds.UpdateTurbine:
    properties:
      description:
        minLength: 10
        type: string
      height:
        type: integer
      image:
        type: string
      isActive:
        type: boolean
      power:
        type: integer
      title:
        maxLength: 100
        minLength: 3
        type: string
    type: object
  ds.UpdateTurbineGenerationRequest:
    properties:
      alpha:
        type: number
      avg_velocity:
        type: number
    type: object
  ds.UpdateUser:
    properties:
      login:
        maxLength: 30
        minLength: 3
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
    type: object
  ds.User:
    properties:
      id:
        type: integer
      is_moderator:
        type: boolean
      login:
        type: string
    type: object
host: localhost:8000
info:
  contact:
    name: Егор Бляблин
  description: API для работы с сервисом расчета генерации электроэнергии ветрогенераторами
  license:
    name: MIT License
  title: Turbines API
  version: 0.2.0
paths:
  /api/generation-requests/:
    get:
      consumes:
      - application/json
      description: Возвращает список заявок пользователя с фильтрацией по дате и статусу
        (кроме удаленных и черновиков)
      parameters:
      - in: path
        name: formed_at_begin
        type: string
      - in: path
        name: formed_at_end
        type: string
      - enum:
        - sent
        - completed
        - rejected
        in: path
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список заявок
          schema:
            items:
              $ref: '#/definitions/ds.GenerationRequest'
            type: array
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Пользователь не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Список заявок с фильтрацией
      tags:
      - Заявки расчета выработки
  /api/generation-requests/{generationRequestId}/:
    get:
      consumes:
      - application/json
      description: Возвращает информацию о конкретной заявке с деталями и связанными
        турбинами
      parameters:
      - description: ID заявки
        in: path
        name: generationRequestId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Информация о заявке
          schema:
            $ref: '#/definitions/ds.GenerationRequest'
        "401":
          description: Пользователь не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Получение информации о заявке
      tags:
      - Заявки расчета выработки
  /api/generation-requests/{generationRequestId}/close/:
    put:
      consumes:
      - application/json
      description: Модератор завершает или отклоняет заявку (только для модераторов)
      parameters:
      - description: ID заявки
        in: path
        name: generationRequestId
        required: true
        type: integer
      - description: 'Статус: completed или rejected'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CloseGenerationRequest.req'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленная заявка
          schema:
            $ref: '#/definitions/ds.GenerationRequest'
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Пользователь не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Заявка не может быть закрыта
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Завершение/отклонение заявки модератором
      tags:
      - Заявки расчета выработки
  /api/generation-requests/draft/:
    delete:
      consumes:
      - application/json
      description: Удаляет черновик заявки текущего пользователя
      produces:
      - application/json
      responses:
        "204":
          description: Черновик удален
        "404":
          description: Черновик не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Удаление черновика заявки
      tags:
      - Заявки расчета выработки
    get:
      consumes:
      - application/json
      description: Возвращает информацию о черновике заявки текущего пользователя
      produces:
      - application/json
      responses:
        "200":
          description: Информация о черновике
          schema:
            $ref: '#/definitions/ds.GenerationRequest'
        "401":
          description: Пользователь не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Получение информации о черновике заявки
      tags:
      - Заявки расчета выработки
    put:
      consumes:
      - application/json
      description: Обновляет поля черновика заявки текущего пользователя
      parameters:
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ds.UpdateGenerationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленный черновик
          schema:
            $ref: '#/definitions/ds.GenerationRequest'
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Пользователь не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Черновик не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Обновление черновика заявки
      tags:
      - Заявки расчета выработки
  /api/generation-requests/draft/{turbineId}/:
    delete:
      consumes:
      - application/json
      description: Удаляет турбину из черновика заявки текущего пользователя
      parameters:
      - description: ID турбины
        in: path
        name: turbineId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Турбина удалена
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Пользователь не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Турбина или черновик не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Удаление турбины из черновика
      tags:
      - Заявки расчета выработки
    post:
      consumes:
      - application/json
      description: Добавляет турбину в черновик заявки текущего пользователя
      parameters:
      - description: ID турбины
        in: path
        name: turbineId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Турбина добавлена
          schema:
            additionalProperties:
              type: string
            type: object
        "304":
          description: Турбина уже в черновике
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Пользователь не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Добавление турбины в черновик
      tags:
      - Заявки расчета выработки
    put:
      consumes:
      - application/json
      description: Обновляет параметры (avg_velocity, alpha) турбины в черновике
      parameters:
      - description: ID турбины
        in: path
        name: turbineId
        required: true
        type: integer
      - description: Параметры для обновления
        in: body
        name: updates
        required: true
        schema:
          $ref: '#/definitions/ds.UpdateTurbineGenerationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Параметры обновлены
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Пользователь не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Турбина не найдена в черновике
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Обновление параметров турбины в черновике
      tags:
      - Заявки расчета выработки
  /api/generation-requests/draft/submit/:
    put:
      consumes:
      - application/json
      description: Формирует черновик заявки и отправляет на рассмотрение
      produces:
      - application/json
      responses:
        "200":
          description: Черновик отправлен
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Пользователь не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Черновик не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Отправка черновика заявки
      tags:
      - Заявки расчета выработки
  /api/turbines/:
    get:
      consumes:
      - application/json
      description: Возвращает список активных турбин с возможностью фильтрации по
        названию
      parameters:
      - description: Фильтр по названию турбины
        in: query
        name: turbineTitle
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список турбин
          schema:
            items:
              $ref: '#/definitions/ds.Turbine'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Список турбин с фильтрацией
      tags:
      - Ветрогенераторы
    post:
      consumes:
      - application/json
      description: Создает новую турбину без изображения
      parameters:
      - description: Данные новой турбины
        in: body
        name: turbine
        required: true
        schema:
          $ref: '#/definitions/ds.CreateTurbine'
      produces:
      - application/json
      responses:
        "201":
          description: Созданная турбина
          schema:
            $ref: '#/definitions/ds.Turbine'
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Создание новой турбины
      tags:
      - Ветрогенераторы
  /api/turbines/{turbineId}/:
    delete:
      consumes:
      - application/json
      description: Удаляет турбину по ID
      parameters:
      - description: ID турбины
        in: path
        name: turbineId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Турбина успешно удалена
        "404":
          description: Турбина не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Некорректный ID турбины
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Удаление турбины
      tags:
      - Ветрогенераторы
    get:
      consumes:
      - application/json
      description: Возвращает информацию о конкретной турбине по ID
      parameters:
      - description: ID турбины
        in: path
        name: turbineId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Информация о турбине
          schema:
            $ref: '#/definitions/ds.Turbine'
        "404":
          description: Турбина не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Некорректный ID турбины
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получение информации о турбине
      tags:
      - Ветрогенераторы
    put:
      consumes:
      - application/json
      description: Обновляет информацию о турбине по ID
      parameters:
      - description: ID турбины
        in: path
        name: turbineId
        required: true
        type: integer
      - description: Данные для обновления
        in: body
        name: turbine
        required: true
        schema:
          $ref: '#/definitions/ds.UpdateTurbine'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленная турбина
          schema:
            $ref: '#/definitions/ds.Turbine'
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Турбина не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Некорректный ID турбины
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Обновление информации о турбине
      tags:
      - Ветрогенераторы
  /api/turbines/{turbineId}/upload-image/:
    post:
      consumes:
      - multipart/form-data
      description: Добавляет или обновляет изображение для турбины
      parameters:
      - description: ID турбины
        in: path
        name: turbineId
        required: true
        type: integer
      - description: Файл изображения
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Обновленная турбина
          schema:
            $ref: '#/definitions/ds.Turbine'
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Турбина не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Некорректный ID турбины
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Добавление изображения к турбине
      tags:
      - Ветрогенераторы
  /api/users/:
    get:
      consumes:
      - application/json
      description: Возвращает информацию о текущем аутентифицированном пользователе
      produces:
      - application/json
      responses:
        "200":
          description: Информация о пользователе
          schema:
            $ref: '#/definitions/ds.User'
        "404":
          description: Пользователь не найден
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Получение информации о текущем пользователе
      tags:
      - Пользователи
    post:
      consumes:
      - application/json
      description: Создает нового пользователя с указанными учетными данными
      parameters:
      - description: Данные нового пользователя
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/ds.CreateUser'
      produces:
      - application/json
      responses:
        "201":
          description: Созданный пользователь
          schema:
            $ref: '#/definitions/ds.User'
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Логин уже занят
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация нового пользователя
      tags:
      - Пользователи
    put:
      consumes:
      - application/json
      description: Обновляет информацию о текущем аутентифицированном пользователе
      parameters:
      - description: Данные для обновления
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/ds.UpdateUser'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленный пользователь
          schema:
            $ref: '#/definitions/ds.User'
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Пользователь не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Логин уже занят
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWT: []
      summary: Обновление информации о текущем пользователе
      tags:
      - Пользователи
  /api/users/login/:
    post:
      consumes:
      - application/json
      description: Аутентифицирует пользователя и создает сессию
      parameters:
      - description: Учетные данные пользователя (логин и пароль)
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/ds.CreateUser'
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешной аутентификации
          schema:
            $ref: '#/definitions/api.Login.Res'
        "400":
          description: Некорректные учетные данные
        "403":
